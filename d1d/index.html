<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D1D · Drum Generator</title>
<style>
  :root {
    --bg: #0a0b0f;
    --surface: #12141a;
    --surface-2: #181b23;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.12);
    --text: #e8eaf0;
    --muted: #8a90a2;
    --kick: #ff6a3d;
    --snare: #a78bfa;
    --hat: #22d3ee;
    --accent: var(--kick);
    --player-h: 112px;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); background: var(--bg);
    font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(900px 500px at 15% -10%, rgba(255,106,61,.10), transparent 60%),
      radial-gradient(900px 500px at 90% -5%, rgba(167,139,250,.10), transparent 60%),
      radial-gradient(700px 400px at 50% 110%, rgba(34,211,238,.06), transparent 60%);
    background-attachment: fixed;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px calc(var(--player-h) + 48px); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--kick), var(--snare) 60%, var(--hat));
    box-shadow: 0 6px 24px -6px rgba(167,139,250,.6);
  }
  .logo-mark svg { width: 22px; height: 22px; }
  .logo h1 { font-size: 20px; letter-spacing: .02em; margin: 0; font-weight: 700; }
  .logo h1 span { color: var(--muted); font-weight: 500; }
  .spacer { flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px;
  }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #475066; }
  .dot.ok { background: #34d399; box-shadow: 0 0 10px #34d399; }
  .dot.busy { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; animation: pulse 1s infinite; }
  .ghost {
    background: transparent; border: 1px solid var(--line-2); border-radius: 10px; padding: 7px 12px;
    font-size: 13px; color: var(--muted); transition: .15s;
  }
  .ghost:hover { color: var(--text); border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.03); }

  /* ---------- loading screen ---------- */
  .gate-bar { height: 6px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line-2); overflow: hidden; margin-bottom: 4px; }
  .gate-bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--kick), var(--snare), var(--hat)); transition: width .2s; }
  .gate-card .primary[hidden] { display: none; }
  body.locked .wrap, body.locked .player { display: none; }
  .gate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px; }
  .gate-card {
    width: min(420px, 100%); text-align: center; padding: 36px 28px 26px; border-radius: 26px;
    background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--line);
    box-shadow: 0 40px 90px -40px rgba(0,0,0,.9), 0 0 80px -30px rgba(167,139,250,.35);
  }
  .gate-card .logo-mark { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 18px; }
  .gate-card .logo-mark svg { width: 30px; height: 30px; }
  .gate-card h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: .02em; }
  .gate-card h2 span { color: var(--muted); font-weight: 500; }
  .gate-card p { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
  .gate-card p a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .pw { position: relative; margin-bottom: 12px; }
  .pw input {
    width: 100%; background: var(--bg); border: 1px solid var(--line-2); color: var(--text);
    border-radius: 13px; padding: 14px 46px 14px 16px; font: 16px var(--mono); letter-spacing: .04em;   /* 16px: no zoom on iOS */
    transition: border-color .15s, box-shadow .15s;
  }
  .pw input::placeholder { color: #566; letter-spacing: 0; font-family: inherit; }
  .pw input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .pw .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; background: none; color: var(--muted); border-radius: 9px; display: grid; place-items: center; }
  .pw .eye:hover { color: var(--text); }
  .pw .eye svg { width: 18px; height: 18px; }
  .primary {
    background: var(--text); color: #0a0b0f; border: 0; border-radius: 12px; padding: 11px 20px;
    font-weight: 600; transition: .15s;
  }
  .primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px -8px rgba(255,255,255,.35); }
  .primary:disabled { opacity: .6; cursor: progress; }
  .gate-card .primary { width: 100%; padding: 14px 20px; font-size: 15px; border-radius: 13px; }
  .gate-msg { min-height: 1.3em; margin-top: 14px; font: 12.5px var(--mono); color: var(--muted); }
  .gate-err { min-height: 1.3em; margin-top: 4px; font-size: 13.5px; color: #fb7185; }
  .gate-card.shake { animation: shake .4s; }
  .linkbtn { margin-top: 14px; background: none; border: 0; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
  .linkbtn:hover { color: var(--text); }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

  /* ---------- drum buttons ---------- */
  .pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .pad {
    --c: var(--kick); --p: 0%;
    position: relative; overflow: hidden; isolation: isolate;
    aspect-ratio: 1 / 1.05; border-radius: 24px; border: 1px solid var(--line);
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: transform .15s, border-color .2s, box-shadow .25s, opacity .2s;
  }
  .pad[data-drum="0"] { --c: var(--kick); }
  .pad[data-drum="1"] { --c: var(--snare); }
  .pad[data-drum="2"] { --c: var(--hat); }
  .pad::before {   /* glow */
    content: ""; position: absolute; inset: 0; z-index: -2;
    background: radial-gradient(70% 60% at 50% 38%, color-mix(in srgb, var(--c) 28%, transparent), transparent 70%);
    opacity: .0; transition: opacity .3s;
  }
  .pad::after {    /* progress fill */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--p); z-index: -1;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, transparent), color-mix(in srgb, var(--c) 32%, transparent));
    transition: height .35s ease;
  }
  .pad:not(:disabled):hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 55%, transparent);
    box-shadow: 0 18px 50px -18px color-mix(in srgb, var(--c) 60%, transparent); }
  .pad:not(:disabled):hover::before { opacity: 1; }
  .pad:not(:disabled):active { transform: translateY(0) scale(.98); }
  .pad:disabled { cursor: not-allowed; opacity: .45; }
  .pad.busy { opacity: 1; border-color: color-mix(in srgb, var(--c) 70%, transparent); cursor: progress; }
  .pad.busy::before { opacity: 1; animation: breathe 1.6s ease-in-out infinite; }
  .pad.active { border-color: color-mix(in srgb, var(--c) 50%, transparent); }
  .pad .ico { width: 54px; height: 54px; color: var(--c); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--c) 55%, transparent)); }
  .pad .name { font-size: 22px; font-weight: 700; letter-spacing: .01em; }
  .pad .key {
    position: absolute; top: 14px; right: 14px; font: 600 11px var(--mono); color: var(--muted);
    border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px;
  }
  .pad .sub { position: absolute; bottom: 14px; font: 12px var(--mono); color: var(--muted); }

  /* ---------- controls ---------- */
  .controls {
    margin-top: 22px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px;
  }
  .field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .field input[type=text], .field input[type=number] {
    background: var(--bg); border: 1px solid var(--line-2); color: var(--text); border-radius: 9px;
    padding: 7px 10px; font: 13px var(--mono); width: 150px;
  }
  .field input[type=number] { width: 78px; }
  .switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; color: var(--muted); font-size: 13px; }
  .switch input { display: none; }
  .switch i { width: 34px; height: 20px; border-radius: 99px; background: #2a2f3b; position: relative; transition: .2s; flex: none; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #aab; transition: .2s; }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(14px); background: #fff; }
  .iconbtn {
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 9px; width: 32px; height: 32px;
    display: grid; place-items: center; color: var(--muted); transition: .15s;
  }
  .iconbtn:hover { color: var(--text); border-color: rgba(255,255,255,.3); }
  .iconbtn svg { width: 16px; height: 16px; }
  .status { margin-left: auto; font: 12.5px var(--mono); color: var(--muted); display: flex; gap: 12px; align-items: center; }
  .status button { background: none; border: 0; color: #fb7185; font: inherit; text-decoration: underline; padding: 0; }
  details.adv { margin-top: 12px; color: var(--muted); font-size: 13px; }
  details.adv summary { cursor: pointer; padding: 4px 0; }
  details.adv .row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 10px 0 0; }
  .note { margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 13px; color: #fbbf24;
    background: rgba(251,191,36,.07); border: 1px solid rgba(251,191,36,.2); }

  /* ---------- player ---------- */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: var(--player-h);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(18px) saturate(1.4);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-top: 1px solid var(--line);
  }
  .player::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .7; }
  .player-in { max-width: 920px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 18px; }
  .play {
    flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #0a0b0f;
    display: grid; place-items: center; transition: .15s; box-shadow: 0 8px 28px -8px var(--accent);
  }
  .play:hover:not(:disabled) { transform: scale(1.06); }
  .play:active:not(:disabled) { transform: scale(.96); }
  .play:disabled { background: #232733; color: #555d70; box-shadow: none; cursor: not-allowed; }
  .play svg { width: 24px; height: 24px; }
  .meta { flex: none; width: 200px; min-width: 0; }
  .meta .t { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .meta .s { font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wavebox { flex: 1; min-width: 0; height: 100%; position: relative; border-radius: 12px; background: rgba(255,255,255,.025);
    border: 1px solid var(--line); overflow: hidden; cursor: pointer; }
  .wavebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .wavebox .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  .time { flex: none; font: 12.5px var(--mono); color: var(--muted); width: 104px; text-align: right; white-space: nowrap; }
  .time b { color: var(--text); font-weight: 500; }
  .dl { flex: none; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--player-h) + 20px); transform: translateX(-50%) translateY(10px);
    background: #2a1218; color: #fecdd3; border: 1px solid rgba(251,113,133,.35); padding: 10px 16px; border-radius: 12px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: .25s; max-width: 90vw; z-index: 20; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.info { background: #0f2230; color: #cdeaff; border-color: rgba(34,211,238,.35); }

  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes breathe { 50% { opacity: .45; } }

  @media (max-width: 640px) {
    .wrap { padding: 20px 14px calc(var(--player-h) + 100px); }
    .pads { gap: 10px; }
    .pad { border-radius: 18px; gap: 10px; }
    .pad .ico { width: 38px; height: 38px; }
    .pad .name { font-size: 17px; }
    .pad .key, .pad .sub { display: none; }
    .status { margin-left: 0; width: 100%; }
    .player { --player-h: 150px; padding-inline: 14px; }
    .player-in { flex-wrap: wrap; gap: 10px 12px; align-content: center; }
    .meta { width: auto; flex: 1; }
    .wavebox { order: 5; flex: 0 0 100%; height: 56px; }
    .time { display: none; }
  }
</style>
</head>
<body class="locked">
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0f" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h2M7 7v10M11 3v18M15 8v8M19 10v4M22 12h0"/></svg></div>
    <h2>D1D <span>Drum Generator</span></h2>
    <p>Runs entirely in your browser. The model (19.5 MB) is downloaded once from
      <a href="https://huggingface.co/sixf0ur/D1D-Turbo">Hugging Face</a>.<br>
      Model license: <a href="https://huggingface.co/sixf0ur/D1D-Turbo/blob/main/License.txt">CC BY-NC 4.0</a> (non-commercial).</p>
    <div class="gate-bar" aria-hidden="true"><i id="gateBar"></i></div>
    <button class="primary" id="gateBtn" type="submit" hidden>Retry</button>
    <div class="gate-msg" id="gateMsg" aria-live="polite"></div>
    <div class="gate-err" id="gateErr" role="alert"></div>
    <button type="button" class="linkbtn" id="gateLocal">Load a local model.bin instead</button>
  </form>
  <input type="file" id="file" accept=".bin,application/octet-stream" hidden>
</div>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#0a0b0f" stroke-width="2.4" stroke-linecap="round"><path d="M3 12h2M7 7v10M11 3v18M15 8v8M19 10v4M22 12h0"/></svg></div>
      <h1>D1D <span>Drum Generator</span></h1>
    </div>
    <div class="spacer"></div>
    <div class="chip" id="chip"><span class="dot" id="dot"></span><span id="chipText">no model</span></div>
  </header>


  <main id="app" hidden>
    <div class="pads">
      <button class="pad" data-drum="0" id="pad0">
        <span class="key">1</span>
        <svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="17"/><circle cx="24" cy="24" r="9"/><circle cx="24" cy="24" r="2.5" fill="currentColor"/></svg>
        <span class="name">Kick</span>
      </button>
      <button class="pad" data-drum="1" id="pad1">
        <span class="key">2</span>
        <svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="21" rx="17" ry="7"/><path d="M7 21v10c0 4 7.6 7 17 7s17-3 17-7V21"/><path d="M12 12L22 18M36 10L28 17"/></svg>
        <span class="name">Snare</span>
      </button>
      <button class="pad" data-drum="2" id="pad2">
        <span class="key">3</span>
        <svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="17" rx="18" ry="5"/><ellipse cx="24" cy="22" rx="18" ry="5"/><path d="M24 27v16"/></svg>
        <span class="name">Hi-Hat</span>
      </button>
    </div>

    <div class="controls">
      <label class="switch"><input type="checkbox" id="newSeed" checked><i></i>New seed per click</label>
      <div class="field">Seed
        <input type="text" id="seed" inputmode="numeric" value="42" spellcheck="false">
        <button class="iconbtn" id="dice" title="Roll a random seed" aria-label="Roll a random seed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="status" id="status"><span id="statusText">ready</span><button id="cancel" hidden>cancel</button></div>
    </div>
    <details class="adv">
      <summary>Advanced</summary>
      <div class="row">
        <div class="field">Steps <input type="number" id="steps" min="1" max="200" placeholder="auto"></div>
        <div class="field">CFG <input type="number" id="cfg" min="0" step="0.1" placeholder="auto"></div>
        <label class="switch"><input type="checkbox" id="norm" checked><i></i>Normalize</label>
      </div>
    </details>
    <div class="note" id="slowNote" hidden></div>
  </main>
</div>

<footer class="player" id="player">
  <div class="player-in">
    <button class="play" id="play" disabled aria-label="Play">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <div class="meta"><div class="t" id="mTitle">No sample</div><div class="s" id="mSub">Press a button</div></div>
    <div class="wavebox" id="wavebox">
      <canvas id="wave"></canvas>
      <div class="empty" id="waveEmpty">Your generated sample appears here</div>
    </div>
    <div class="time" id="time"><b>0.00</b> / 0.51 s</div>
    <button class="ghost dl" id="dl" disabled>WAV ↓</button>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script id="d1d-src" type="text/plain">// d1d.js -- pure JavaScript port of d1d.hpp (D1D / D1D-Turbo drum one-shot inference).
// No dependencies. Runs in browsers, Web Workers and Node.
//
//   const model = D1D.Model.load(arrayBuffer);
//   const kick = model.generate(D1D.Drum.Kick, { seed: 42 });   // Float32Array(16384)
//   const wav  = D1D.wavBytes(kick);                            // Uint8Array (16-bit PCM)
//
// Same noise generator (SplitMix64 + Box-Muller) as the C++ header: the same seed
// gives the same start noise, so results match d1d.hpp up to float rounding.
(function (root) {
  'use strict';

  const kSampleRate = 32000;
  const kLength = 16384;
  const kOnset = 256;
  const Drum = { Kick: 0, Snare: 1, Hat: 2 };
  const drumName = (d) => ['kick', 'snare', 'hat'][d] || '?';

  const L = kLength, COND = 128, HEADS = 4, NS = 5, BLOCKS = 2, NULL_CLASS = 3;
  const GN_GROUPS = 8, GN_EPS = 1e-5;
  const f32 = Math.fround;

  // ------------------------------------------------------------ model.bin parser
  function parseBin(buf) {
    const u8 = new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    if (u8.length < 8 || String.fromCharCode(u8[0], u8[1], u8[2], u8[3]) !== 'DDW1')
      throw new Error('d1d: not a model file (magic)');
    let pos = 4;
    const need = (n) => { if (n > u8.length - pos) throw new Error('d1d: truncated model file'); };
    const u32 = () => { need(4); const v = dv.getUint32(pos, true); pos += 4; return v; };
    const count = u32();
    const S = new Map();
    const dec = new TextDecoder();
    for (let i = 0; i < count; i++) {
      const nl = u32(); need(nl);
      const name = dec.decode(u8.subarray(pos, pos + nl)); pos += nl;
      const nd = u32();
      if (nd > 8) throw new Error('d1d: bad tensor rank');
      const shape = []; let n = 1;
      for (let k = 0; k < nd; k++) { const s = u32(); shape.push(s); n *= s; }
      if (n > (u8.length - pos) / 4) throw new Error('d1d: truncated model file');
      // slice() -> aligned copy (works regardless of the byte offset)
      const d = new Float32Array(u8.buffer.slice(u8.byteOffset + pos, u8.byteOffset + pos + n * 4));
      if (!isLittleEndianHost()) {
        for (let k = 0; k < n; k++) d[k] = dv.getFloat32(pos + k * 4, true);
      }
      pos += n * 4;
      S.set(name, { shape, d });
    }
    return S;
  }
  function isLittleEndianHost() { return new Uint8Array(new Uint16Array([1]).buffer)[0] === 1; }

      else xp.set(xd.subarray(s, s + Lin), o);
    }
    const y = new Tensor(cout, Lout);
    const yd = y.d, wd = cv.w;
    const cb4 = cout >> 2 << 2;

    for (let l0 = 0; l0 < Lout; l0 += TL) {
      const l1 = Math.min(Lout, l0 + TL);
      // blocks of 4 output channels: each input value feeds 4 multiply-adds
      let co = 0;
      for (; co < cb4; co += 4) {
        const y0 = co * Lout, y1 = y0 + Lout, y2 = y1 + Lout, y3 = y2 + Lout;
        const b0 = cv.b[co], b1 = cv.b[co + 1], b2 = cv.b[co + 2], b3 = cv.b[co + 3];
        for (let l = l0; l < l1; l++) { yd[y0 + l] = b0; yd[y1 + l] = b1; yd[y2 + l] = b2; yd[y3 + l] = b3; }
        for (let ci = 0; ci < cin; ci++) {
          const xo = ci * Lp;
          for (let kk = 0; kk < K; kk++) {
            const w0 = wd[((co) * cin + ci) * K + kk], w1 = wd[((co + 1) * cin + ci) * K + kk];
            const w2 = wd[((co + 2) * cin + ci) * K + kk], w3 = wd[((co + 3) * cin + ci) * K + kk];
            if (stride === 1) {
              const xb = xo + kk;
              for (let l = l0; l < l1; l++) {
                const v = xp[xb + l];
                yd[y0 + l] += w0 * v; yd[y1 + l] += w1 * v; yd[y2 + l] += w2 * v; yd[y3 + l] += w3 * v;
              }
            } else {
              const xb = xo + kk;
              for (let l = l0; l < l1; l++) {
                const v = xp[xb + l * stride];
                yd[y0 + l] += w0 * v; yd[y1 + l] += w1 * v; yd[y2 + l] += w2 * v; yd[y3 + l] += w3 * v;
              }
            }
          }
        }
      }
      for (; co < cout; co++) {   // leftover channels (Cout not a multiple of 4)
        const y0 = co * Lout, b0 = cv.b[co];
        for (let l = l0; l < l1; l++) yd[y0 + l] = b0;
        for (let ci = 0; ci < cin; ci++) {
          const xo = ci * Lp;
          for (let kk = 0; kk < K; kk++) {
            const w0 = wd[(co * cin + ci) * K + kk];
            for (let l = l0; l < l1; l++) yd[y0 + l] += w0 * xp[xo + kk + l * stride];
          }
        }
      }
    }
    if (add) { const ad = add.d; for (let i = 0; i < yd.length; i++) yd[i] += ad[i]; }
    return y;
  }

  // ------------------------------------------------------------ group norm
  // GroupNorm(min(8,C), C), biased variance, eps 1e-5, per-channel affine.
  // Optional FiLM: out = GN(x)*(1+film_g) + film_b (arrays + offset). Optional SiLU.
  function groupNorm(x, gamma, beta, filmG, filmB, filmOff, act) {
    const C = x.C, Ln = x.L, G = Math.min(GN_GROUPS, C), cg = C / G, xd = x.d;
    const mean = new Float64Array(G), inv = new Float64Array(G);
    for (let g = 0; g < G; g++) {
      let t = 0;
      for (let i = g * cg * Ln, e = (g + 1) * cg * Ln; i < e; i++) t += xd[i];
      mean[g] = t / (cg * Ln);
    }
    for (let g = 0; g < G; g++) {
      const m = f32(mean[g]);
      let t = 0;
      for (let i = g * cg * Ln, e = (g + 1) * cg * Ln; i < e; i++) { const d = xd[i] - m; t += d * d; }
      inv[g] = 1 / Math.sqrt(t / (cg * Ln) + GN_EPS);
    }
    const y = new Tensor(C, Ln), yd = y.d;
    let wbase = 0, wm = null;
    if (KERN) {
      wbase = KERN.scratch(2 * C * Ln * 4);
      wm = KERN.f();
      wm.set(xd, wbase >> 2);
    }
    for (let c = 0; c < C; c++) {
      const g = (c / cg) | 0;
      let a = f32(gamma[c] * inv[g]);
      let b = f32(beta[c] - mean[g] * gamma[c] * inv[g]);
      if (filmG) {
        const s1 = f32(1 + filmG[filmOff + c]);
        a = f32(a * s1);
        b = f32(f32(b * s1) + filmB[filmOff + c]);
      }
      const o = c * Ln;
      if (KERN) { KERN.ex.affine(wbase + o * 4, wbase + (C * Ln + o) * 4, Ln, a, b, act ? 1 : 0); continue; }
      if (act) for (let i = 0; i < Ln; i++) { const v = xd[o + i] * a + b; yd[o + i] = v / (1 + Math.exp(-v)); }
      else for (let i = 0; i < Ln; i++) yd[o + i] = xd[o + i] * a + b;
    }
    if (KERN) yd.set(wm.subarray((wbase >> 2) + C * Ln, (wbase >> 2) + 2 * C * Ln));
    return y;
  }

  // y = W x + b  (nn.Linear)
  function linear(W, b, x) {
    const out = W.shape[0], inn = W.shape[1], wd = W.d, y = new Float32Array(out);
    for (let o = 0; o < out; o++) {
      let s = b.d[o];
      for (let i = 0; i < inn; i++) s += wd[o * inn + i] * x[i];
      y[o] = s;
    }
    return y;
  }

  // ------------------------------------------------------------ RNG (SplitMix64 + Box-Muller)
  const M64 = (1n << 64n) - 1n;
  class Rng {
    constructor(seed) { this.s = BigInt.asUintN(64, BigInt(seed)); }
    next() {
      this.s = (this.s + 0x9E3779B97F4A7C15n) & M64;
      let z = this.s;
      z = ((z ^ (z >> 30n)) * 0xBF58476D1CE4E5B9n) & M64;
      z = ((z ^ (z >> 27n)) * 0x94D049BB133111EBn) & M64;
      return z ^ (z >> 31n);
    }
    uniform() { return (Number(this.next() >> 11n) + 0.5) * (1.0 / 9007199254740992.0); }
    normal(out, n) {
      for (let i = 0; i < n; i += 2) {
        const r = Math.sqrt(-2.0 * Math.log(this.uniform())), a = 6.283185307179586 * this.uniform();
        out[i] = r * Math.cos(a);
        if (i + 1 < n) out[i + 1] = r * Math.sin(a);
      }
    }
  }

  // ------------------------------------------------------------ network
  class Net {
    constructor(S, kern) {
      this.S = S;
      this.kern = kern;
      KERN = kern;
      this.checkArchitecture();
      this.convs = new Map();
      for (const [n, a] of S) {
        if (!n.endsWith('.weight') || a.shape.length !== 3) continue;
        const base = n.slice(0, -7);
        const down = base.startsWith('downsample.');
        this.convs.set(base, makeConv(S, base, down ? 2 : 1, down ? 1 : a.shape[2] >> 1));
      }
      // fixed sin-cos position table for the attention at L=1024, C=192
      const C = 192, Lq = 1024, half = C / 2;
      this.pos = new Float32Array(C * Lq);
      for (let k = 0; k < half; k++) {
        const w = 1.0 / Math.pow(10000.0, k / half);
        for (let p = 0; p < Lq; p++) {
          this.pos[k * Lq + p] = Math.sin(p * w);
          this.pos[(k + half) * Lq + p] = Math.cos(p * w);
        }
      }
    }
    has(n) { return this.S.has(n); }
    A(n) { const a = this.S.get(n); if (!a) throw new Error('d1d: missing weight ' + n); return a; }
    P(n) { return this.A(n).d; }
    cv(n) { const c = this.convs.get(n); if (!c) throw new Error('d1d: missing conv ' + n); return c; }
    gated() { return this.has('gate.weight'); }
    meta(n, fallback) { const a = this.S.get(n); return a && a.d.length ? a.d[0] : fallback; }

    checkArchitecture() {
      const expect = (n, shape) => {
        const a = this.S.get(n);
        if (!a || a.shape.length !== shape.length || a.shape.some((v, i) => v !== shape[i]))
          throw new Error('d1d: unexpected model architecture (' + n + ')');
      };
      expect('stem.weight', [32, 1, 7]);
      expect('cls_emb.weight', [4, COND]);
      expect('mid_attn.qkv.weight', [576, 192, 1]);
      expect('mid_attn.pos_gate', [1, 192, 1]);
      expect('out.weight', [1, 32, 7]);
    }

    // c = t_mlp(timestep_embedding(t)) + cls_emb[y]
    conditioning(t, y) {
      const half = COND / 2, e = new Float32Array(COND);
      const nl = f32(-f32(Math.log(10000.0)));
      for (let k = 0; k < half; k++) {
        const fr = f32(Math.exp(f32(f32(nl * k) / half)));
        const a = f32(f32(t * fr) * 1000);
        e[k] = Math.cos(a);
        e[k + half] = Math.sin(a);
      }
      const h = linear(this.A('t_mlp.0.weight'), this.A('t_mlp.0.bias'), e);
      for (let i = 0; i < h.length; i++) h[i] = silu(h[i]);
      const c = linear(this.A('t_mlp.2.weight'), this.A('t_mlp.2.bias'), h);
      const emb = this.P('cls_emb.weight');
      for (let i = 0; i < COND; i++) c[i] += emb[y * COND + i];
      return c;
    }

    resBlock(p, x, c, skipIn) {   // x: Tensor (already concatenated if needed)
      let h = conv1d(this.cv(p + '.c1'),
        groupNorm(x, this.P(p + '.n1.weight'), this.P(p + '.n1.bias'), null, null, 0, true));
      const gb = linear(this.A(p + '.emb.weight'), this.A(p + '.emb.bias'), c);
      // first half of gb = scale g, second half = shift b
      h = groupNorm(h, this.P(p + '.n2.weight'), this.P(p + '.n2.bias'),
        gb.subarray(0, h.C), gb.subarray(h.C, 2 * h.C), 0, true);
      if (this.has(p + '.skip.weight')) {
        const s = conv1d(this.cv(p + '.skip'), x);
        return conv1d(this.cv(p + '.c2'), h, false, s);
      }
      if (skipIn) throw new Error('d1d: ' + p + ': concat input without skip conv');
      return conv1d(this.cv(p + '.c2'), h, false, x);
    }

    attention(p, x) {
      const C = x.C, Ln = x.L, D = C / HEADS;
      const h = groupNorm(x, this.P(p + '.n.weight'), this.P(p + '.n.bias'), null, null, 0, false);
      if (this.has(p + '.pos_gate')) {
        if (C * Ln !== this.pos.length) throw new Error('d1d: pos table shape');
        const gate = this.P(p + '.pos_gate'), hd = h.d;
        for (let ch = 0; ch < C; ch++) {
          const o = ch * Ln;
          for (let i = 0; i < Ln; i++) hd[o + i] += gate[ch] * this.pos[o + i];
        }
      }
      const qkv = conv1d(this.cv(p + '.qkv'), h), qd = qkv.d;
      const o = new Tensor(C, Ln), od = o.d;
      const scale = f32(1 / Math.sqrt(D));
      if (KERN && Ln % 4 === 0) {
        const nq = 3 * C * Ln, no = C * Ln;
        const base = KERN.scratch((nq + no + 4 * Ln) * 4), m = KERN.f(), q0 = base >> 2;
        m.set(qd, q0);
        KERN.ex.attn(base, base + nq * 4, C, Ln, HEADS, scale, base + (nq + no) * 4);
        od.set(m.subarray(q0 + nq, q0 + nq + no));
        return conv1d(this.cv(p + '.proj'), o, false, x);
      }
      const s = new Float32Array(Ln);
      for (let hd = 0; hd < HEADS; hd++) {
        for (let i = 0; i < Ln; i++) {
          s.fill(0);
          for (let d = 0; d < D; d++) {
            const q = f32(qd[(hd * D + d) * Ln + i] * scale);
            const ko = (C + hd * D + d) * Ln;
            for (let j = 0; j < Ln; j++) s[j] += q * qd[ko + j];
          }
          let mx = s[0];
          for (let j = 1; j < Ln; j++) if (s[j] > mx) mx = s[j];
          let sum = 0;
          for (let j = 0; j < Ln; j++) { const e = f32(Math.exp(s[j] - mx)); s[j] = e; sum += e; }
          const inv = f32(1 / sum);
          for (let d = 0; d < D; d++) {
            const vo = (2 * C + hd * D + d) * Ln;
            let acc = 0;
            for (let j = 0; j < Ln; j++) acc += s[j] * qd[vo + j];
            od[(hd * D + d) * Ln + i] = acc * inv;
          }
        }
      }
      return conv1d(this.cv(p + '.proj'), o, false, x);
    }

    // One net pass: x (L) noisy waveform, t in [0,1), class 0..3 -> velocity into vOut (L).
    forward(xIn, t, y, vOut) {
      KERN = this.kern;
      const c = this.conditioning(t, y);
      const x = new Tensor(1, L, Float32Array.from(xIn));
      const skips = [];
      skips.push(conv1d(this.cv('stem'), x));
      for (let i = 0; i < NS; i++) {
        for (let j = 0; j < BLOCKS; j++)
          skips.push(this.resBlock('down.' + i + '.' + j, skips[skips.length - 1], c));
        if (i < NS - 1) skips.push(conv1d(this.cv('downsample.' + i), skips[skips.length - 1]));
      }
      let h = this.resBlock('mid1', skips[skips.length - 1], c);
      h = this.attention('mid_attn', h);
      h = this.resBlock('mid2', h, c);
      for (let u = 0; u < NS; u++) {
        for (let j = 0; j < BLOCKS + 1; j++) {
          h = this.resBlock('up.' + u + '.' + j, concat(h, skips[skips.length - 1]), c, true);
          skips.pop();
        }
        const a = 'up_attn.' + u;
        if (this.has(a + '.qkv.weight')) h = this.attention(a, h);
        const us = 'upsample.' + u;
        if (this.has(us + '.weight')) h = conv1d(this.cv(us), h, true);
      }
      if (skips.length) throw new Error('d1d: skip stack not drained');
      h = groupNorm(h, this.P('out_norm.weight'), this.P('out_norm.bias'), null, null, 0, true);
      const v = conv1d(this.cv('out'), h);
      if (!this.gated()) { vOut.set(v.d.subarray(0, L)); return; }
      // learned output gate (D1D-Turbo), same op order as the C++ / PyTorch code
      const gt = conv1d(this.cv('gate'), h);
      const om = Math.max(f32(1 - t), f32(1e-3));
      const vp = v.d, gp = gt.d;
      for (let j = 0; j < L; j++) {
        const g = Math.min(1, Math.max(0, f32(1 + gp[j])));
        vOut[j] = f32(f32(g * vp[j]) + f32(f32(f32(g - 1) * xIn[j]) / om));
      }
    }
  }

  // ------------------------------------------------------------ public API
  class Model {
    // opts.wasm = false forces the plain-JS kernels (default: WASM SIMD when available)
    constructor(S, opts) {
      const useWasm = !(opts && opts.wasm === false);
      this.kern = useWasm ? WasmKernels.create() : null;
      this.net = new Net(S, this.kern);
    }
    // buf: ArrayBuffer / Uint8Array with the contents of model.bin
    static load(buf, opts) { return new Model(parseBin(buf), opts); }
    get backend() { return this.kern ? 'wasm-simd' : 'js'; }

    defaultSteps() { return Math.max(1, Math.trunc(this.net.meta('meta.steps', 3))); }
    defaultCfg() { return this.net.meta('meta.cfg_w', 1); }
    gated() { return this.net.gated(); }       // true for D1D-Turbo

    static makeNoise(seed, out) { new Rng(seed).normal(out, kLength); }

    // opts: { seed=0, steps=0, cfg=0, normalize=true, peak=0.95, progress(done,total) }
    // Returns Float32Array(kLength), or null if progress() returned false.
    generate(drum, opts) {
      const p = Object.assign({ seed: 0, steps: 0, cfg: 0, normalize: true, peak: 0.95, progress: null }, opts);
      if (!(drum >= 0 && drum <= 2)) throw new Error('d1d: drum class must be 0 (kick), 1 (snare) or 2 (hat)');
      const out = new Float32Array(kLength);
      Model.makeNoise(p.seed, out);
      const ok = this.sample(drum, out, p.steps > 0 ? p.steps : this.defaultSteps(),
        p.cfg > 0 ? p.cfg : this.defaultCfg(), p.progress);
      if (!ok) return null;
      if (p.normalize) {
        let peak = 0;
        for (let i = 0; i < kLength; i++) peak = Math.max(peak, Math.abs(out[i]));
        if (peak > 1e-6) { const g = f32(p.peak / peak); for (let i = 0; i < kLength; i++) out[i] *= g; }
      }
      return out;
    }

    // Rectified-flow Euler sampler, in place. cfg 1 = no guidance.
    sample(cls, x, steps, cfg, progress) {
      if (steps < 1) throw new Error('d1d: steps must be >= 1');
      const v = new Float32Array(kLength), vu = new Float32Array(kLength);
      const dt = 1.0 / steps, dtf = f32(dt);
      for (let i = 0; i < steps; i++) {
        const t = f32(i * dt);
        this.net.forward(x, t, cls, v);
        if (cfg !== 1) {
          this.net.forward(x, t, NULL_CLASS, vu);
          for (let j = 0; j < kLength; j++) v[j] = vu[j] + cfg * (v[j] - vu[j]);
        }
        for (let j = 0; j < kLength; j++) x[j] += v[j] * dtf;
        if (progress && progress(i + 1, steps) === false) return false;
      }
      return true;
    }
  }

  // ------------------------------------------------------------ WAV output
  // Mono WAV file image. 16-bit PCM (default) or 32-bit float.
  function wavBytes(x, sampleRate, float32) {
    sampleRate = sampleRate || kSampleRate;
    const n = x.length, bps = float32 ? 4 : 2, data = n * bps;
    const out = new Uint8Array(44 + data), dv = new DataView(out.buffer);
    const tag = (o, s) => { for (let i = 0; i < 4; i++) out[o + i] = s.charCodeAt(i); };
    tag(0, 'RIFF'); dv.setUint32(4, 36 + data, true); tag(8, 'WAVE');
    tag(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, float32 ? 3 : 1, true);
    dv.setUint16(22, 1, true); dv.setUint32(24, sampleRate, true);
    dv.setUint32(28, sampleRate * bps, true); dv.setUint16(32, bps, true); dv.setUint16(34, 8 * bps, true);
    tag(36, 'data'); dv.setUint32(40, data, true);
    for (let i = 0; i < n; i++) {
      if (float32) dv.setFloat32(44 + i * 4, x[i], true);
      else {
        const c = Math.max(-1, Math.min(1, x[i]));
        dv.setInt16(44 + i * 2, Math.round(c * 32767), true);
      }
    }
    return out;
  }

  const api = { kSampleRate, kLength, kOnset, Drum, drumName, Model, wavBytes, parseBin };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.D1D = api;
})(typeof self !== 'undefined' ? self : this);
</script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const SR = 32000, LEN = 16384;
  const DRUMS = [
    { key: 'kick',  label: 'Kick',   color: '#ff6a3d' },
    { key: 'snare', label: 'Snare',  color: '#a78bfa' },
    { key: 'hat',   label: 'Hi-Hat', color: '#22d3ee' },
  ];

  // ---------------------------------------------------------------- worker
  const WORKER_GLUE = `
    let model = null;
    onmessage = (e) => {
      const m = e.data;
      try {
        if (m.type === 'load') {
          model = D1D.Model.load(m.buf);
          postMessage({ type: 'loaded', gated: model.gated(), steps: model.defaultSteps(),
                        cfg: model.defaultCfg(), backend: model.backend });
        } else if (m.type === 'gen') {
          const t0 = performance.now();
          const out = model.generate(m.drum, { seed: BigInt(m.seed), steps: m.steps, cfg: m.cfg, normalize: m.normalize,
            progress: (done, total) => { postMessage({ type: 'progress', id: m.id, done, total, ms: performance.now() - t0 }); return true; } });
          postMessage({ type: 'done', id: m.id, out, ms: performance.now() - t0 }, [out.buffer]);
        }
      } catch (err) { postMessage({ type: 'error', id: m.id, message: String(err && err.message || err) }); }
    };`;
  let workerURL = null, worker = null, modelBytes = null, info = null;

  function spawnWorker() {
    if (worker) worker.terminate();
    if (!workerURL) {
      const src = $('d1d-src').textContent;
      workerURL = URL.createObjectURL(new Blob([src, '\n', WORKER_GLUE], { type: 'text/javascript' }));
    }
    worker = new Worker(workerURL);
    worker.onmessage = onWorkerMsg;
    worker.onerror = (e) => { toast('Worker error: ' + (e.message || 'unknown')); setBusy(null); };
  }

  // ---------------------------------------------------------------- model loading
  // model.bin is loaded from the Hugging Face Hub (licensed CC BY-NC 4.0, separately
  // from this site's code). Pinned to a commit so a later upload can't silently
  // break the parser; bump the hash when publishing a new model version.
  const MODEL_URL = 'https://huggingface.co/sixf0ur/D1D-Turbo/resolve/71192682bafdaaa249c76a622f1729abef2a7eea/model.bin';
  const gateEl = { form: $('gateForm'), btn: $('gateBtn'), msg: $('gateMsg'), err: $('gateErr'), bar: $('gateBar') };
  let gateBusy = false;

  function gateStatus(t) { gateEl.msg.textContent = t || ''; }
  function gateError(t) {
    gateEl.err.textContent = t || '';
    if (t) { gateEl.form.classList.remove('shake'); void gateEl.form.offsetWidth; gateEl.form.classList.add('shake'); }
  }
  function gateIdle() { gateBusy = false; gateEl.btn.disabled = false; gateEl.btn.hidden = false; }
  function gateProgress(f) { gateEl.bar.style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%'; }

  async function fetchModel() {
    const r = await fetch(MODEL_URL);
    if (!r.ok) throw new Error('model.bin not found (HTTP ' + r.status + ')');
    const total = +r.headers.get('content-length') || 19501795;
    if (!r.body) { gateProgress(1); return await r.arrayBuffer(); }
    const reader = r.body.getReader(), chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      gateProgress(got / total);
      gateStatus('Downloading model … ' + Math.min(100, Math.round(got / total * 100)) + ' %');
    }
    const out = new Uint8Array(got);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out.buffer;
  }

  function loadModel(buf) {
    modelBytes = buf;
    setChip('busy', 'Loading model …');
    spawnWorker();
    worker.postMessage({ type: 'load', buf: buf.slice(0) });
  }

  async function loadFile(file) {   // local fallback: a model.bin from disk
    try {
      gateBusy = true; gateEl.btn.disabled = true; gateError(''); gateStatus('Reading file …');
      loadModel(await file.arrayBuffer());
    } catch (e) { gateIdle(); gateStatus(''); gateError('Could not read the file.'); }
  }

  async function start() {
    if (gateBusy) return;
    gateBusy = true; gateEl.btn.disabled = true; gateEl.btn.hidden = true; gateError('');
    gateProgress(0);
    try {
      gateStatus('Downloading model …');
      let buf;
      try { buf = await fetchModel(); } catch (err) { throw new Error(err.message === 'Failed to fetch' ? 'Could not download the model.' : err.message); }
      gateStatus('Starting …');
      loadModel(buf);
    } catch (err) {
      gateStatus(''); gateError(err.message); gateIdle();
    }
  }

  gateEl.form.addEventListener('submit', (e) => { e.preventDefault(); start(); });

  function setChip(state, text) { $('dot').className = 'dot ' + state; $('chipText').innerHTML = text; }

  // ---------------------------------------------------------------- generation
  let busy = null, genId = 0, lastSeedUsed = null, lastDrum = 0;

  function setBusy(drum) {
    busy = drum;
    for (let i = 0; i < 3; i++) {
      const p = $('pad' + i);
      p.disabled = drum !== null && drum !== i;
      p.classList.toggle('busy', drum === i);
      if (drum !== i) p.style.setProperty('--p', '0%');
    }
    $('cancel').hidden = drum === null;
    $('newSeed').disabled = $('seed').disabled = drum !== null;
  }

  function randomSeed() { return String((crypto.getRandomValues(new Uint32Array(1))[0]) >>> 0); }

  function parseSeed() {
    const t = $('seed').value.trim();
    if (!/^\d{1,20}$/.test(t)) throw new Error('Seed must be a number');
    return t;
  }

  function generate(drum) {
    if (busy !== null || !info) return;
    let seed;
    try {
      if ($('newSeed').checked) { seed = randomSeed(); $('seed').value = seed; } else seed = parseSeed();
    } catch (e) { toast(e.message); return; }
    unlockAudio();   // inside the click -> allowed to start audio later (iOS)
    const steps = parseInt($('steps').value, 10) || 0;
    const cfg = parseFloat($('cfg').value) || 0;
    const id = ++genId;
    lastSeedUsed = seed; lastDrum = drum;
    setBusy(drum);
    $('statusText').textContent = 'Starting network …';
    $('pad' + drum).style.setProperty('--p', '4%');
    worker.postMessage({ type: 'gen', id, drum, seed, steps, cfg, normalize: $('norm').checked });
  }

  function onWorkerMsg(e) {
    const m = e.data;
    if (m.type === 'loaded') {
      info = m;
      showApp();
    } else if (m.type === 'progress') {
      if (m.id !== genId || busy === null) return;
      $('pad' + busy).style.setProperty('--p', Math.round(m.done / m.total * 100) + '%');
      const eta = m.done < m.total ? ' · ~' + (m.ms / m.done * (m.total - m.done) / 1000).toFixed(1) + ' s left' : '';
      $('statusText').textContent = `Step ${m.done}/${m.total}${eta}`;
    } else if (m.type === 'done') {
      if (m.id !== genId) return;
      const drum = busy;
      setBusy(null);
      $('statusText').textContent = `done in ${(m.ms / 1000).toFixed(2)} s`;
      showSample(m.out, drum, lastSeedUsed, m.ms);
    } else if (m.type === 'error') {
      if (!info) { // load failed
        setChip('', 'no model'); gateStatus(''); gateError(m.message); gateIdle();
      } else { setBusy(null); $('statusText').textContent = 'error'; toast(m.message); }
    }
  }

  $('cancel').onclick = () => {   // the worker is busy: kill it and reload the model
    genId++;
    setBusy(null);
    $('statusText').textContent = 'cancelled';
    const info0 = info; info = null;
    spawnWorker();
    worker.postMessage({ type: 'load', buf: modelBytes.slice(0) });
    info = info0;   // keep UI enabled; the worker queues the next gen after load
  };

  function showApp() {
    $('gate').hidden = true; document.body.classList.remove('locked'); $('app').hidden = false;
    const name = info.gated ? 'D1D-Turbo' : 'D1D';
    setChip('ok', `<b>${name}</b> · ${info.steps} Steps · CFG ${info.cfg} · ${info.backend === 'wasm-simd' ? 'WASM SIMD' : 'JS (slow)'}`);
    $('steps').placeholder = 'auto (' + info.steps + ')';
    $('cfg').placeholder = 'auto (' + info.cfg + ')';
    for (let i = 0; i < 3; i++) $('pad' + i).disabled = false;
    const passes = info.steps * (info.cfg === 1 ? 1 : 2);
    const note = $('slowNote');
    if (passes > 12) {
      note.hidden = false;
      note.textContent = `The full D1D needs ${passes} network passes per sample. In the browser this takes much longer than the Turbo model (progress is shown on the button). Lower "Steps" under "Advanced" to speed it up.`;
    } else note.hidden = true;
    if (info.backend !== 'wasm-simd') { note.hidden = false; note.textContent = 'WebAssembly SIMD is not available in this browser. Falling back to the slow JS version.'; }
  }

  // ---------------------------------------------------------------- audio + player
  let actx = null, buffer = null, src = null, startedAt = 0, offset = 0, playing = false, raf = 0, samples = null, wavURL = null;

  // iOS / Safari: audio only starts from a real gesture (touchend / click, NOT pointerdown/touchstart),
  // and Web Audio is muted by the ringer switch unless the page uses the "playback" audio channel.
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let silentEl = null;
  function ensureAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}   // Safari 16.4+
    }
    if (actx.state !== 'running') { try { const p = actx.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    return actx;
  }
  function unlockAudio() {
    const c = ensureAudio();
    try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) {}
    if (IOS && !navigator.audioSession && !silentEl) {   // older iOS: a silent <audio> keeps the media channel open
      const n = 800, dv = new DataView(new ArrayBuffer(44 + n * 2)), t = (o, x) => { for (let i = 0; i < 4; i++) dv.setUint8(o + i, x.charCodeAt(i)); };
      t(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); t(8, 'WAVE'); t(12, 'fmt '); dv.setUint32(16, 16, true);
      dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, 8000, true); dv.setUint32(28, 16000, true);
      dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); t(36, 'data'); dv.setUint32(40, n * 2, true);
      silentEl = new Audio(URL.createObjectURL(new Blob([dv], { type: 'audio/wav' })));
      silentEl.loop = true; silentEl.setAttribute('playsinline', '');
      silentEl.play().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.hidden) silentEl.pause(); else silentEl.play().catch(() => {}); });
    }
  }
  const unlockEvents = ['touchend', 'click', 'keydown'];
  function unlockOnce() {
    const was = actx && actx.state === 'running';
    unlockAudio();
    if (was) unlockEvents.forEach((ev) => window.removeEventListener(ev, unlockOnce, true));
  }
  unlockEvents.forEach((ev) => window.addEventListener(ev, unlockOnce, true));

  function showSample(data, drum, seed, ms) {
    samples = data;
    const d = DRUMS[drum];
    document.documentElement.style.setProperty('--accent', d.color);
    for (let i = 0; i < 3; i++) $('pad' + i).classList.toggle('active', i === drum);
    $('mTitle').textContent = d.label;
    $('mSub').textContent = `seed ${seed} · ${(ms / 1000).toFixed(1)} s`;
    $('waveEmpty').hidden = true;
    $('play').disabled = false; $('dl').disabled = false;
    ensureAudio();
    buffer = actx.createBuffer(1, LEN, SR);
    buffer.copyToChannel(data, 0);
    stop();
    drawWave(0);
    if (actx.state === 'running') play(0);
    else toast('Sample ready. Tap play to hear it.', true);   // browser blocked autoplay
  }

  function stop() {
    if (src) { src.onended = null; try { src.stop(); } catch (e) {} src.disconnect(); src = null; }
    playing = false; cancelAnimationFrame(raf);
    setPlayIcon(false);
  }

  function play(from) {
    if (!buffer) return;
    ensureAudio();
    stop();
    const s = actx.createBufferSource();
    s.buffer = buffer; s.connect(actx.destination);
    src = s; offset = from;
    playing = true; setPlayIcon(true);
    s.onended = () => { if (src === s && playing) { playing = false; setPlayIcon(false); drawWave(1); updateTime(buffer.duration); } };
    const go = () => {
      if (src !== s) return;
      startedAt = actx.currentTime;
      try { s.start(0, from); } catch (e) { stop(); toast('Audio error: ' + e.message); return; }
      tick();
    };
    if (actx.state === 'running') { go(); return; }
    // not running yet (e.g. iOS suspended/interrupted): wait for resume(), but do not hang forever
    const guard = setTimeout(() => { if (src === s && actx.state !== 'running') { stop(); drawWave(0); toast('Tap play again to enable sound.', true); } }, 700);
    actx.resume().then(() => { clearTimeout(guard); go(); }, () => {});
  }

  function progress() { return Math.min(1, (offset + (actx.currentTime - startedAt)) / buffer.duration); }
  function tick() {
    if (!playing) return;
    const p = progress();
    drawWave(p); updateTime(p * buffer.duration);
    raf = requestAnimationFrame(tick);
  }

  function setPlayIcon(on) {
    $('play').innerHTML = on
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
    $('play').setAttribute('aria-label', on ? 'Stop' : 'Play');
  }
  function updateTime(t) { $('time').innerHTML = `<b>${t.toFixed(2)}</b> / ${(LEN / SR).toFixed(2)} s`; }

  $('play').onclick = () => { if (playing) { stop(); drawWave(0); updateTime(0); } else play(0); };
  $('wavebox').addEventListener('click', (e) => {   // click, not pointerdown: iOS only unlocks audio on touchend/click
    if (!buffer) return;
    const r = $('wavebox').getBoundingClientRect();
    play(Math.max(0, Math.min(0.999, (e.clientX - r.left) / r.width)) * buffer.duration);
  });

  // waveform
  const canvas = $('wave'), cx = canvas.getContext('2d');
  function drawWave(p) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    }
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, w, h);
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ff6a3d';
    const mid = h / 2;
    cx.fillStyle = 'rgba(255,255,255,.07)'; cx.fillRect(0, mid, w, 1);
    if (!samples) return;
    const px = Math.floor(w), step = LEN / px, split = p * w;
    for (let x = 0; x < px; x++) {
      let mn = 0, mx = 0;
      const a = Math.floor(x * step), b = Math.max(a + 1, Math.floor((x + 1) * step));
      for (let i = a; i < b; i++) { const v = samples[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
      const y0 = mid - mx * (mid - 4), y1 = mid - mn * (mid - 4);
      cx.fillStyle = x < split ? accent : accent + '55';
      cx.fillRect(x, y0, 1, Math.max(1, y1 - y0));
    }
    if (p > 0 && p < 1) { cx.fillStyle = '#fff'; cx.fillRect(Math.floor(split), 0, 1.5, h); }
  }
  new ResizeObserver(() => drawWave(playing && buffer ? progress() : 0)).observe($('wavebox'));
  drawWave(0);

  // download
  $('dl').onclick = () => {
    if (!samples) return;
    // the library only runs inside the worker; load a copy here just for wavBytes()
    if (!window.D1D) new Function($('d1d-src').textContent)();
    const wav = window.D1D.wavBytes(samples, SR);
    if (wavURL) URL.revokeObjectURL(wavURL);
    wavURL = URL.createObjectURL(new Blob([wav], { type: 'audio/wav' }));
    const a = document.createElement('a');
    a.href = wavURL; a.download = `${DRUMS[lastDrum].key}_${lastSeedUsed}.wav`;
    document.body.appendChild(a); a.click(); a.remove();
  };

  // ---------------------------------------------------------------- UI wiring
  for (let i = 0; i < 3; i++) $('pad' + i).onclick = () => generate(i);
  $('dice').onclick = () => { $('seed').value = randomSeed(); $('newSeed').checked = false; };
  $('seed').addEventListener('input', () => { $('newSeed').checked = false; });
  $('gateLocal').onclick = () => $('file').click();
  $('file').onchange = (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };

  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === ' ') { if (buffer) { e.preventDefault(); $('play').click(); } }
    else if (e.key >= '1' && e.key <= '3' && info) generate(+e.key - 1);
  });

  let toastT = 0;
  function toast(msg, info) { const t = $('toast'); t.textContent = msg; t.classList.toggle('info', !!info); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 4500); }

  // ---------------------------------------------------------------- startup: download the model right away
  if (location.protocol !== 'file:') start();
  else { gateStatus('Opened from disk: serve the folder over http, or use the local file option below.'); gateEl.btn.hidden = true; }
})();
</script>
</body>
</html>
